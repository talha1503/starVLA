# Figure 2 zero-latency QwenOFT H1 recipe; dataset paths are filled by the launcher.
# Source: benchmark-models@56b2c095 and benchmark code@2f18d462.
run_id: openvla_mikasa_mixed_01234_h1
run_root_dir: results/Checkpoints
seed: 0
wandb_entity: talha1503
wandb_project: starvla_tasks
wandb_group: vla-train
wandb_tags: [mikasa, h1, mixed_01234]
training_latency_condition: mixed_01234
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    enable_gradient_checkpointing: false
  action_model:
    action_model_type: MLP
    action_dim: 7
    action_env_dim: 7
    state_dim: 7
    action_hidden_dim: 2560
    state_encoding: continuous_projector
    action_horizon: 1
    future_action_window_size: 0
    past_action_window_size: 0
    loss_type: l1
    task_objective: null

datasets:
  vla_data:
    dataset_py: latency_bench_tasks
    lerobot_version: v3.0
    include_state: true
    task_contract_path: null
    data_root_dir: /
    data_mix: train
    eval_data_mix: validation
    custom_mixtures_path: null
    sequential_step_sampling: true
    shuffle: true
    per_device_batch_size: 16
    load_all_data_for_training: true
    pin_memory: true
    persistent_workers: false
    num_workers: 0
    prefetch_factor: null
    obs_image_size: [224, 224]
    video_backend: pyav
    image_mode: single
    stitch_grid: [1, 2]
    num_obs_frames: 1
    prompt_mode: raw

trainer:
  max_train_steps: 5000
  stop_after_steps: 5000
  num_warmup_steps: 100
  save_interval: 5000
  eval_interval: 5000
  eval_num_batches: 1
  logging_frequency: 5
  learning_rate:
    base: 3.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  freeze_vit: false
  freeze_tied_embedding: false
  freeze_llm_layers: []
  loss_scale:
    vla: 1.0
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  pretrained_checkpoint: null
  is_resume: false
  distributed_backend: none
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
    fused: true

checkpoint:
  save_best_model: false
  save_final_model: true
  save_pt_file: true
  save_training_state: false
  save_safetensors_file: false
  local:
    keep_last_n: 1
  sync:
    enabled: true
    repo_id: null
    keep_last_n: 0
